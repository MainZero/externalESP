name: Build C++ External ESP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile
      run: |
        cl /EHsc /O2 /MD /Fe:ExternalESP.exe main.cpp /link user32.lib gdi32.lib psapi.lib advapi32.lib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ExternalESP
        path: ExternalESP.exe
